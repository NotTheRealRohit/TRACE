<?xml version="1.0"?>
<svg width="679.9999999999999" height="300" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <title>DTC Feature Extraction</title>
 <desc>Flow showing how DTC codes are parsed and converted to features</desc>
 <defs>
  <marker id="arrow7" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10">
   <path d="m2,1l6,4l-6,4" fill="none" id="svg_1" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
  </marker>
  <style>.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
      .c-gray text { fill: #444441; }
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1; }
      .c-blue text { fill: #0C447C; }
      .c-purple rect { fill: #DED8F6; stroke: #534AB7; stroke-width: 1; }
      .c-purple text { fill: #3C3489; }
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
      .c-teal text { fill: #085041; }
      .c-green rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 1; }
      .c-green text { fill: #27500A; }
      .node rect { stroke-width: 1; }
      .box rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
      .box text { fill: #444441; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
      text { font-family: sans-serif; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; }</style>
 </defs>
 <g class="layer">
  <title>Layer 1</title>
  <text class="th" fill="#212121" font-size="16" font-weight="500" id="svg_2" text-anchor="middle" x="340" y="25">DTC Feature Extraction</text>
  <g class="node c-gray" id="svg_3">
   <rect height="45" id="svg_4" rx="8" width="160" x="30" y="60"/>
   <text class="th" font-size="11" id="svg_5" text-anchor="middle" x="110" y="85">DTC String</text>
   <text class="ts" font-size="10" id="svg_6" text-anchor="middle" x="110" y="103">&#x27;P0562,P0563,...&#x27;</text>
  </g>
  <line class="arr" id="svg_7" marker-end="url(#arrow7)" stroke="#534AB7" x1="190" x2="220" y1="82" y2="82"/>
  <g class="node c-blue" id="svg_8">
   <rect height="45" id="svg_9" rx="8" width="120" x="230" y="60"/>
   <text class="th" font-size="11" id="svg_10" text-anchor="middle" x="290" y="85">Split by &#x27;,&#x27;</text>
   <text class="ts" font-size="10" id="svg_11" text-anchor="middle" x="290" y="103">Parse codes</text>
  </g>
  <line class="arr" id="svg_12" marker-end="url(#arrow7)" stroke="#534AB7" x1="350" x2="380" y1="82" y2="82"/>
  <g class="node c-purple" id="svg_13">
   <rect height="45" id="svg_14" rx="8" width="130" x="390" y="60"/>
   <text class="th" font-size="11" id="svg_15" text-anchor="middle" x="455" y="85">Prefix Detection</text>
   <text class="ts" font-size="10" id="svg_16" text-anchor="middle" x="455" y="103">P/U/C/B flags</text>
  </g>
  <line class="arr" id="svg_17" marker-end="url(#arrow7)" stroke="#534AB7" x1="520" x2="550" y1="82" y2="82"/>
  <g class="node c-teal" id="svg_18">
   <rect height="45" id="svg_19" rx="8" width="110" x="560" y="60"/>
   <text class="th" font-size="11" id="svg_20" text-anchor="middle" x="615" y="85">High-Value DTC</text>
   <text class="ts" font-size="10" id="svg_21" text-anchor="middle" x="615" y="103">One-Hot Match</text>
  </g>
  <text class="ts" fill="#212121" font-size="11" font-weight="500" id="svg_22" text-anchor="middle" x="340" y="145">Output Feature Vector:</text>
  <g class="node c-green" id="svg_23">
   <rect height="28" id="svg_24" rx="6" width="100" x="130" y="160"/>
   <text class="th" font-size="9" id="svg_25" text-anchor="middle" x="180" y="177">dtc_count: 2</text>
  </g>
  <g class="node c-green" id="svg_26">
   <rect height="28" id="svg_27" rx="6" width="100" x="240" y="160"/>
   <text class="th" font-size="9" id="svg_28" text-anchor="middle" x="290" y="177">has_P: 1</text>
  </g>
  <g class="node c-green" id="svg_29">
   <rect height="28" id="svg_30" rx="6" width="100" x="350" y="160"/>
   <text class="th" font-size="9" id="svg_31" text-anchor="middle" x="400" y="177">has_U: 0</text>
  </g>
  <g class="node c-green" id="svg_32">
   <rect height="28" id="svg_33" rx="6" width="100" x="460" y="160"/>
   <text class="th" font-size="9" id="svg_34" text-anchor="middle" x="510" y="177">has_C: 0</text>
  </g>
  <g class="node c-green" id="svg_35">
   <rect height="28" id="svg_36" rx="6" width="90" x="570" y="160"/>
   <text class="th" font-size="9" id="svg_37" text-anchor="middle" x="615" y="177">has_B: 0</text>
  </g>
  <g class="node" id="svg_38">
   <rect class="box" height="28" id="svg_39" rx="6" width="100" x="130" y="198"/>
   <text class="ts" fill="#ffff00" font-size="9" id="svg_40" text-anchor="middle" x="180" y="215">dtc_p0562: 1</text>
  </g>
  <g class="node" id="svg_41">
   <rect class="box" height="28" id="svg_42" rx="6" width="100" x="240" y="198"/>
   <text class="ts" fill="#ffff00" font-size="9" id="svg_43" style="cursor: move;" text-anchor="middle" x="290" y="215">dtc_p0563: 1</text>
  </g>
  <g class="node" id="svg_44">
   <rect class="box" height="28" id="svg_45" rx="6" width="100" x="350" y="198"/>
   <text class="ts" fill="#ffff00" font-size="9" id="svg_46" style="cursor: move;" text-anchor="middle" x="400" y="215">dtc_p0123: 0</text>
  </g>
  <g class="node" id="svg_47">
   <rect class="box" height="28" id="svg_48" rx="6" width="100" x="460" y="198"/>
   <text class="ts" fill="#ffff00" font-size="9" id="svg_49" style="cursor: move;" text-anchor="middle" x="510" y="215">...</text>
  </g>
 </g>
</svg>