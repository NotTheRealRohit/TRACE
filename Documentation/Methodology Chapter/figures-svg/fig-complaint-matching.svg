<?xml version="1.0"?>
<svg width="680" height="340" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <title>Complaint Matching</title>
 <desc>Flow showing keyword scan and fuzzy matching for technician notes</desc>
 <defs>
  <marker id="arrow8" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10">
   <path d="m2,1l6,4l-6,4" fill="none" id="svg_1" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
  </marker>
  <style>.c-amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1; }
      .c-amber text { fill: #633806; }
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1; }
      .c-blue text { fill: #0C447C; }
      .c-purple rect { fill: #DED8F6; stroke: #534AB7; stroke-width: 1; }
      .c-purple text { fill: #3C3489; }
      .c-green rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 1; }
      .c-green text { fill: #27500A; }
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
      .c-gray text { fill: #444441; }
      .node rect { stroke-width: 1; }
      .box rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
      .box text { fill: #444441; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
      text { font-family: sans-serif; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; }</style>
 </defs>
 <g class="layer">
  <title>Layer 1</title>
  <text class="th" fill="#212121" font-size="16" font-weight="500" id="svg_2" text-anchor="middle" x="340" y="25">Complaint Matching</text>
  <g class="node c-amber" id="svg_3">
   <rect height="40" id="svg_4" rx="8" width="160" x="30" y="55"/>
   <text class="th" font-size="12" id="svg_5" text-anchor="middle" x="110" y="78">Technician Notes</text>
  </g>
  <line class="arr" id="svg_6" marker-end="url(#arrow8)" stroke="#534AB7" x1="190" x2="230" y1="75" y2="75"/>
  <g class="node c-blue" id="svg_7">
   <rect height="40" id="svg_8" rx="8" width="130" x="240" y="55"/>
   <text class="th" font-size="11" id="svg_9" text-anchor="middle" x="305" y="78">Keyword Scan</text>
   <text class="ts" fill="#0C447C" font-size="9" id="svg_10" text-anchor="middle" x="305" y="92">(first match wins)</text>
  </g>
  <polygon fill="#DED8F6" id="svg_11" points="420,50 450,75 420,100 390,75" stroke="#534AB7" stroke-width="1.5" transform="matrix(1.34649, 0, 0, 1.36487, -124.947, -25.4561)"/>
  <text class="th" fill="#3C3489" font-size="9" id="svg_12" text-anchor="middle" transform="matrix(1, 0, 0, 1, 22.4862, 5.09122)" x="420" y="72">Match?</text>
  <text class="th" fill="#534AB7" font-size="9" id="svg_13" text-anchor="middle" transform="matrix(1, 0, 0, 1, 22.4862, 10.6067)" x="420" y="84">(1)</text>
  <line class="arr" id="svg_14" marker-end="url(#arrow8)" stroke="#534AB7" transform="matrix(1, 0, 0, 1, 3.39415, -8.90963)" x1="370" x2="390" y1="75" y2="75"/>
  <text fill="#3B6D11" font-size="8" id="svg_15" transform="matrix(1, 0, 0, 1, 33.0929, -3.81841)" x="430" y="115">Yes</text>
  <line class="arr" id="svg_16" marker-end="url(#arrow8)" stroke="#3B6D11" transform="matrix(-1, 0, 0, 0.563772, 863.335, 58.7113)" x1="420" x2="420" y1="100" y2="140"/>
  <text fill="#A32D2D" font-size="8" id="svg_17" x="380" y="90">No</text>
  <g class="node c-purple" id="svg_18">
   <rect height="40" id="svg_19" rx="8" width="130" x="240" y="150"/>
   <text class="th" font-size="11" id="svg_20" text-anchor="middle" x="305" y="173">Fuzzy Match</text>
   <text class="ts" fill="#3C3489" font-size="9" id="svg_21" text-anchor="middle" x="305" y="187">cutoff=0.25</text>
  </g>
  <line id="svg_22" marker-end="url(#arrow8)" stroke="#A32D2D" stroke-dasharray="4,3" x1="390" x2="370" y1="75" y2="75"/>
  <polygon fill="#DED8F6" id="svg_23" points="420,150 450,175 420,200 390,175" stroke="#534AB7" stroke-width="1.5" transform="matrix(1.27219, 0, 0, 1.27219, -85.8944, -49.843)"/>
  <text class="th" fill="#3C3489" font-size="9" id="svg_24" text-anchor="middle" transform="matrix(1, 0, 0, 1, 27.5774, 0)" x="420" y="172">Match?</text>
  <text class="th" fill="#534AB7" font-size="9" id="svg_25" text-anchor="middle" transform="matrix(1, 0, 0, 1, 27.5774, 0)" x="420" y="184">(2)</text>
  <line class="arr" id="svg_26" marker-end="url(#arrow8)" stroke="#534AB7" x1="370" x2="390" y1="170" y2="170"/>
  <text fill="#3B6D11" font-size="8" id="svg_27" transform="matrix(1, 0, 0, 1, 25.8804, 0)" x="430" y="215">Yes</text>
  <line class="arr" id="svg_28" marker-end="url(#arrow8)" stroke="#3B6D11" transform="matrix(1, 0, 0, 1, 28.8502, 15.6979)" x1="420" x2="420" y1="200" y2="230"/>
  <text fill="#A32D2D" font-size="8" id="svg_29" transform="matrix(1, 0, 0, 1, 6.36402, 0.424268)" x="380" y="190">No</text>
  <g class="node c-green" id="svg_30" transform="matrix(1, 0, 0, 1, 25.8804, 14.4251)">
   <rect height="35" id="svg_31" rx="8" width="130" x="240" y="240"/>
   <text class="th" font-size="11" id="svg_32" text-anchor="middle" x="305" y="261">Complaint Label</text>
  </g>
  <g class="node c-gray" id="svg_33" transform="matrix(1, 0, 0, 1, -5.09122, 15.2737)">
   <rect height="35" id="svg_34" rx="8" width="140" x="390" y="240"/>
   <text class="th" font-size="10" id="svg_35" text-anchor="middle" x="460" y="261">OBD Light ON</text>
   <text class="ts" font-size="8" id="svg_36" text-anchor="middle" x="460" y="274">(default)</text>
  </g>
  <line id="svg_37" marker-end="url(#arrow8)" stroke="#A32D2D" stroke-dasharray="4,3" transform="matrix(1, 0, 0, 1, 1.69707, 5.51549)" x1="390" x2="370" y1="190" y2="190"/>
 </g>
</svg>