   <text class="th" fill="#534AB7" font-size="10" id="svg_16" text-anchor="middle" x="180" y="98">Rule Engine</text>
   <rect fill="#534AB7" height="1" id="svg_17" opacity="0.3" width="90" x="135" y="125"/>
   <text class="ts" fill="#3C3489" font-size="8" id="svg_18" text-anchor="middle" x="180" y="138">IN: fault_code,</text>
