   <text class="ts" fill="#3C3489" font-size="8" id="svg_21" text-anchor="middle" x="180" y="178">WD, confidence</text>
  </g>
  <g class="node c-amber" id="svg_22">
   <rect height="120" id="svg_23" rx="8" width="100" x="240" y="60"/>
