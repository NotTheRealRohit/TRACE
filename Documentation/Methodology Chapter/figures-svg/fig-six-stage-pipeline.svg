   <text class="th" fill="#0F6E56" font-size="10" id="svg_35" text-anchor="middle" x="400" y="98">XGBoost</text>
   <text class="th" fill="#0F6E56" font-size="10" id="svg_36" text-anchor="middle" x="400" y="112">Cascade</text>
   <rect fill="#0F6E56" height="1" id="svg_37" opacity="0.3" width="90" x="355" y="125"/>
   <text class="ts" fill="#085041" font-size="8" id="svg_38" text-anchor="middle" x="400" y="138">IN: feature vector</text>
   <text class="ts" fill="#085041" font-size="8" id="svg_39" text-anchor="middle" x="400" y="152">OUT: FA prob,</text>
   <text class="ts" fill="#085041" font-size="8" id="svg_40" text-anchor="middle" x="400" y="166">WD prediction</text>
   <text class="ts" fill="#085041" font-size="7" font-style="italic" id="svg_41" text-anchor="middle" x="400" y="178">(Always active)</text>
  </g>
  <g class="node c-coral" id="svg_42">
   <rect height="120" id="svg_43" rx="8" width="100" x="460" y="60"/>
   <text class="th" fill="#712B13" font-size="11" id="svg_44" text-anchor="middle" x="510" y="80">Stage 5</text>
   <text class="th" fill="#993C1D" font-size="10" id="svg_45" text-anchor="middle" x="510" y="98">Score</text>
   <text class="th" fill="#993C1D" font-size="10" id="svg_46" text-anchor="middle" x="510" y="112">Combination</text>
   <rect fill="#993C1D" height="1" id="svg_47" opacity="0.3" width="90" x="465" y="125"/>
   <text class="ts" fill="#712B13" font-size="8" id="svg_48" text-anchor="middle" x="510" y="138">IN: rule, ML, LLM</text>
   <text class="ts" fill="#712B13" font-size="8" id="svg_49" text-anchor="middle" x="510" y="152">OUT: combined</text>
   <text class="ts" fill="#712B13" font-size="8" id="svg_50" text-anchor="middle" x="510" y="166">confidence, status</text>
   <text class="ts" fill="#712B13" font-size="8" id="svg_51" text-anchor="middle" x="510" y="178">engine tag</text>
  </g>
  <line class="arr" id="svg_52" marker-end="url(#arrow2)" stroke="#534AB7" x1="120" x2="130" y1="120" y2="120"/>
  <line class="arr" id="svg_53" marker-end="url(#arrow2)" stroke="#534AB7" x1="230" x2="240" y1="120" y2="120"/>
