  <rect fill="#DED8F6" height="10" id="svg_65" stroke="#534AB7" width="10" x="193" y="350"/>
  <text class="ts" fill="#3C3489" font-size="8" id="svg_66" x="207" y="359">Rule</text>
  <rect fill="#E1F5EE" height="10" id="svg_67" stroke="#0F6E56" width="10" x="239" y="350"/>
  <text class="ts" fill="#085041" font-size="8" id="svg_68" x="253" y="359">ML</text>
  <rect fill="#FAECE7" height="10" id="svg_69" stroke="#993C1D" width="10" x="289" y="350"/>
  <text class="ts" fill="#712B13" font-size="8" id="svg_70" x="303" y="359">Score</text>
  <rect fill="#EAF3DE" height="10" id="svg_71" stroke="#3B6D11" width="10" x="349" y="350"/>
  <text class="ts" fill="#27500A" font-size="8" id="svg_72" x="363" y="359">Output</text>
