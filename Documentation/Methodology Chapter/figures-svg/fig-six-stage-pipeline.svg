   <text class="th" fill="#EF9F27" font-size="10" id="svg_25" text-anchor="middle" x="290" y="98">Feature</text>
   <text class="th" fill="#EF9F27" font-size="10" id="svg_26" text-anchor="middle" x="290" y="112">Translation</text>
   <rect fill="#854F0B" height="1" id="svg_27" opacity="0.3" width="90" x="245" y="125"/>
   <text class="ts" fill="#633806" font-size="8" id="svg_28" text-anchor="middle" x="290" y="138">IN: notes, DTC</text>
   <text class="ts" fill="#633806" font-size="8" id="svg_29" text-anchor="middle" x="290" y="152">OUT: customer_</text>
   <text class="ts" fill="#633806" font-size="8" id="svg_30" text-anchor="middle" x="290" y="166">complaint, dtc_</text>
   <text class="ts" fill="#633806" font-size="8" id="svg_31" text-anchor="middle" x="290" y="178">features</text>
  </g>
  <g class="node c-teal" id="svg_32">
   <rect height="120" id="svg_33" rx="8" width="100" x="350" y="60"/>
