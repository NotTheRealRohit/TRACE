  <line class="arr" id="svg_55" marker-end="url(#arrow2)" stroke="#534AB7" x1="450" x2="460" y1="120" y2="120"/>
  <rect fill="#F1EFE8" height="35" id="svg_56" rx="4" stroke="#5F5E5A" stroke-width="0.5" transform="matrix(1.38968, 0, 0, 1.20534, -129.667, -47.2279)" width="220" x="230" y="220"/>
  <text class="ts" fill="#444441" font-size="9" id="svg_57" text-anchor="middle" x="340" y="243">Decision Engine: LLM+Rule+ML | Rule+ML | ML</text>
  <g class="node c-green" id="svg_58">
   <rect height="45" id="svg_59" rx="8" width="120" x="280" y="280"/>
   <text class="th" font-size="11" id="svg_60" text-anchor="middle" x="340" y="300">ClaimResponse</text>
   <text class="ts" font-size="9" id="svg_61" text-anchor="middle" x="340" y="318">JSON output</text>
  </g>
