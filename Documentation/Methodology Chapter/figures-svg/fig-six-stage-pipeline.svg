  <line class="arr" id="svg_74" marker-end="url(#arrow2)" stroke="#534AB7" transform="matrix(-0.0312349, 0.999512, -0.999512, -0.0312349, 696.437, -66.7665)" x1="341.53" x2="351.53" y1="342.68" y2="342.68"/>
