<?xml version="1.0"?>
<svg width="680" height="400" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <title>Six-Stage Pipeline: Inputs, Processing, Outputs</title>
