 <g class="layer">
  <title>Layer 1</title>
  <text class="th" fill="#212121" font-size="16" font-weight="500" id="svg_2" text-anchor="middle" x="340" y="25">Six-Stage Pipeline: Inputs, Processing, Outputs</text>
  <g class="node c-amber" id="svg_3">
   <rect height="120" id="svg_4" rx="8" width="100" x="20" y="60"/>
   <text class="th" fill="#633806" font-size="11" id="svg_5" text-anchor="middle" x="70" y="80">Stage 1</text>
   <text class="th" fill="#EF9F27" font-size="10" id="svg_6" text-anchor="middle" x="70" y="98">LLM</text>
   <text class="th" fill="#EF9F27" font-size="10" id="svg_7" text-anchor="middle" x="70" y="112">Understanding</text>
   <rect fill="#854F0B" height="1" id="svg_8" opacity="0.3" width="90" x="25" y="125"/>
