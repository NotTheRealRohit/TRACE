<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 350" role="img">
  <title>Train/Test Split: Split-Before-Fit</title>
  <desc>Illustration of train/test split before model fitting to prevent data leakage</desc>

  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1; }
      .c-blue text { fill: #0C447C; }
      .c-purple rect { fill: #DED8F6; stroke: #534AB7; stroke-width: 1; }
      .c-purple text { fill: #3C3489; }
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
      .c-teal text { fill: #085041; }
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; }
      .c-coral text { fill: #712B13; }
      .c-green rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 1; }
      .c-green text { fill: #27500A; }
      .node rect { stroke-width: 1; }
      .box rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
      .box text { fill: #444441; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
      text { font-family: sans-serif; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; }
    </style>
  </defs>

  <text class="th" x="340" y="25" text-anchor="middle" font-size="16" font-weight="500" fill="#212121">Train/Test Split: Split-Before-Fit</text>

  <g class="node c-blue">
    <rect x="240" y="55" width="200" height="45" rx="8"/>
    <text class="th" x="340" y="80" text-anchor="middle" font-size="12">DataFrame (100K rows)</text>
  </g>

  <line x1="340" y1="100" x2="340" y2="130" class="arr" stroke="#534AB7" marker-end="url(#arrow5)"/>

  <g class="node c-purple">
    <rect x="230" y="140" width="220" height="40" rx="8"/>
    <text class="th" x="340" y="163" text-anchor="middle" font-size="13">train_test_split()</text>
  </g>

  <line x1="280" y1="140" x2="180" y2="140" class="arr" stroke="#534AB7" marker-end="url(#arrow5)"/>
  <line x1="400" y1="140" x2="500" y2="140" class="arr" stroke="#534AB7" marker-end="url(#arrow5)"/>

  <g class="node c-green">
    <rect x="50" y="180" width="160" height="50" rx="8"/>
    <text class="th" x="130" y="202" text-anchor="middle" font-size="13">Training (80K)</text>
  </g>

  <g class="node c-blue">
    <rect x="470" y="180" width="160" height="50" rx="8"/>
    <text class="th" x="550" y="202" text-anchor="middle" font-size="13">Test (20K)</text>
  </g>

  <g class="node c-teal">
    <rect x="30" y="270" width="150" height="40" rx="8"/>
    <text class="th" x="105" y="293" text-anchor="middle" font-size="12">fit_transform()</text>
  </g>

  <g class="node c-coral">
    <rect x="500" y="270" width="140" height="40" rx="8"/>
    <text class="th" x="570" y="293" text-anchor="middle" font-size="12">transform()</text>
  </g>

  <rect x="150" y="330" width="380" height="1" fill="#A32D2D" opacity="0.5"/>
  <text class="ts" x="340" y="345" text-anchor="middle" font-size="10" fill="#A32D2D">Data Leakage Prevention: Fit ONLY on training data</text>
</svg>